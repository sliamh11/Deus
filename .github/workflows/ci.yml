name: CI

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter reads the PR changed-file list via the API on pull_request runs

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci

      - name: No personal identifiers in diff
        # Pattern is stored as a repo secret to avoid committing the values
        # themselves into this file. Excludes this workflow file from the scan
        # so editing the gate doesn't trip it.
        env:
          PATTERN: ${{ secrets.PERSONAL_ID_PATTERN }}
        run: |
          set -euo pipefail
          if [ -z "${PATTERN:-}" ]; then
            if [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ] || [ "${{ github.actor }}" = "dependabot[bot]" ]; then
              echo "::warning::PERSONAL_ID_PATTERN unavailable in fork/dependabot PR; skipping"
              exit 0
            fi
            echo "::error::PERSONAL_ID_PATTERN secret not set; required for non-fork PRs"
            exit 1
          fi
          BASE_REF="${{ github.base_ref }}"
          BASE_REF="${BASE_REF:-main}"
          # Scan only ADDED lines (leading '+', excluding the '+++' file
          # header) so that REMOVING personal identifiers — e.g. deleting a
          # leaking file — does not trip the gate on its own deletion lines.
          if git diff "origin/${BASE_REF}...HEAD" -- ':(exclude).github/workflows/ci.yml' ':(exclude)LICENSE' | grep -E '^\+' | grep -vE '^\+\+\+' | grep -qE "${PATTERN}"; then
            echo "::error::Personal identifiers found in diff — public-repo code must be user-agnostic (feedback_public_repo_generic)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Typecheck skill hosts
        run: npx tsc -p tsconfig.skills.json --noEmit

      - name: Tests
        run: npx vitest run

      - name: Install pytest
        # httpx is pinned because the warden tests below import codex_review ->
        # cross_family_review, which sys.exit()s on a missing httpx at module load: a
        # breaking httpx major would otherwise surface as a cryptic collection-time exit
        # rather than a clean failure. Installed here (before any pytest step) so the
        # warden suite is always collectable.
        #
        # sqlite-vec is installed here too (LIA-372): the memory suites below have
        # only sparse skipif guards and memory_indexer does a bare `import
        # sqlite_vec`, so they are NOT safe to run before it is present. Installing
        # it up front lets every python test step run in the same environment.
        #
        # pyyaml is installed here for the connectors tests below: connectors/
        # providers/cliproxy_oauth does a bare `import yaml` at module load
        # (CLIProxyAPI's own config format is YAML), so it must be present before
        # that step runs too.
        run: python3 -m pip install pytest 'httpx>=0.27,<1.0' sqlite-vec==0.1.6 pyyaml

      - name: Pattern drift check
        run: python3 scripts/drift_check.py --all --base origin/${{ github.base_ref }}

      - name: Pattern tests (Python)
        run: python3 -m pytest scripts/tests/test_drift_check.py scripts/tests/test_prune_warden_backups.py scripts/tests/test_session_preflight.py scripts/tests/test_session_preflight_hook.py scripts/tests/test_sync_linear_pending.py -v

      - name: Warden review tests
        # Regression-protect the provider-agnostic warden co-gate engine: the gpt +
        # openai_compat backends, the role specs, the strict-AND gate / loop guard / HITL
        # override (test_warden_review), the driver (test_codex_warden), the codex engine
        # (test_codex_review), the Phase 3 co-gate oracle, and the full hook engine incl.
        # the admin-merge + structural-check gates (test_codex_warden_hooks), and the
        # one-command co-gate marker wrapper (test_cogate). All hermetic — the gh CLI and
        # model seams are mocked, so no codex CLI / gh / network is touched.
        run: python3 -m pytest scripts/tests/test_warden_review.py scripts/tests/test_codex_warden.py scripts/tests/test_codex_review.py scripts/tests/test_phase3_cogate_oracle.py scripts/tests/test_codex_warden_hooks.py scripts/tests/test_cogate.py -v

      - name: Session type contract tests
        run: python3 -m pytest tests/test_session_type_contract.py -v

      - name: Memory / code-search / verdict-store tests
        # Regression net for the retrieval-store + verdict-store layers (LIA-372).
        # Hermetic: network calls are stubbed and live-DB paths are redirected to
        # tmp via fixtures. sqlite-vec is installed in the "Install pytest" step
        # above, so these suites (which touch the embeddings vec table) run in a
        # complete environment. test_memory_indexer[_ner].py get their own steps
        # (the former is ~200s).
        run: |
          python3 -m pytest \
            scripts/tests/test_memory_gc.py \
            scripts/tests/test_memory_retrieval_hook.py \
            scripts/tests/test_memory_tree_hook.py \
            scripts/tests/test_memory_health.py \
            scripts/tests/test_memory_tree_params.py \
            scripts/tests/test_memory_query.py \
            scripts/tests/test_memory_benchmark.py \
            scripts/tests/test_memory_tree_phase3.py \
            scripts/tests/test_memory_mcp_server.py \
            scripts/tests/test_code_search_resolver.py \
            scripts/tests/test_code_search_cal_cache_bust.py \
            scripts/tests/test_code_search_calibration.py \
            scripts/tests/test_verdict_store_race.py \
            scripts/tests/test_verdict_store_lock.py \
            scripts/tests/test_verdict_store_staleness.py \
            -v

      - name: Memory tree tests
        # Own line so the -k deselect below applies only to this file. 5 tests
        # need a live embedding provider (Ollama/Gemini) or numpy that the CI
        # runner lacks — deselected here; follow-up LIA-438 adds proper
        # skipif(provider-unavailable) guards so they can be re-included. The
        # other ~154 tests (incl. the LIA-369 embed-failure regression tests)
        # run normally.
        run: |
          python3 -m pytest scripts/tests/test_memory_tree.py -v \
            -k "not (test_embed_text_receives_original_prompt_only \
                 or test_approach_boost_score \
                 or test_approach_max_not_avg \
                 or test_coverage_gate_forces_abstain \
                 or test_convex_blend_produces_moderate_score)"

      - name: CLAUDE.md keyword coverage
        run: scripts/token_bench/ci_coverage_gate.sh origin/${{ github.base_ref }}

      - name: Install evolution test dependencies
        # google-genai is import-only for memory_indexer (the network client is
        # never built in tests); required so test_memory_indexer_contradiction_commit
        # can import the module. See that test's module docstring. (sqlite-vec is
        # already installed in the "Install pytest" step above.)
        run: python3 -m pip install google-genai

      - name: Memory indexer NER tests
        # Fast (~0.05s). sqlite-vec + google-genai are both installed by now.
        run: python3 -m pytest scripts/tests/test_memory_indexer_ner.py -v

      # NOTE: test_memory_indexer.py is intentionally NOT wired in here yet —
      # 54/279 of its tests require a live embedding provider (Ollama/Gemini/
      # sentence_transformers) the CI runner lacks. Deferred to LIA-438, which
      # will add skipif(provider-unavailable) guards (or a stub embedder) so it
      # can run in CI; test_memory_tree.py's 5 deselected tests are in the same
      # follow-up.

      - name: Evolution tests
        run: python3 -m pytest evolution/tests/ -v

      - name: Connectors tests
        run: python3 -m pytest connectors/tests/ scripts/tests/test_connectors_cli.py -v

      - name: Validate commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  test-packages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            packages:
              - 'packages/**'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.packages == 'true'
        with:
          node-version: 20
      - name: Build and test packages
        if: steps.filter.outputs.packages == 'true'
        run: |
          # Build core first (dependency for all channel packages)
          cd packages/mcp-channel-core && npm install && npm run build && npm test && cd ../..
          # Build and test all channel packages dynamically
          for pkg in packages/mcp-*/; do
            [ "$pkg" = "packages/mcp-channel-core/" ] && continue
            echo "::group::Testing $pkg"
            cd "$pkg" && npm install && npm run build && npm test && cd ../..
            echo "::endgroup::"
          done

  test-tui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Build
        working-directory: tui
        run: cargo build --release
      - name: Clippy
        working-directory: tui
        run: cargo clippy -- -D warnings
      - name: Format check
        working-directory: tui
        run: cargo fmt -- --check
      - name: Tests
        working-directory: tui
        run: cargo test

  test-windows:
    # Pinned: windows-latest moved to a VS 18 image that node-gyp 10.x cannot
    # detect, breaking the better-sqlite3 native build at `npm ci`. windows-2022
    # ships VS 2022 (recognized). Revert to windows-latest once node-gyp supports VS 18.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

  test-agent-runner:
    runs-on: ubuntu-latest
    # PR-only, mirroring test-packages (merge queue is not enabled on this repo).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            agent-runner:
              - 'container/agent-runner/**'
      - uses: actions/setup-node@v7
        if: steps.filter.outputs.agent-runner == 'true'
        with:
          node-version: 20
      # node 20 ships npm 10.8.2, and the whole npm 10.x line crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on the
      # `npm install --no-save` step below. Reproduced against main's OWN
      # agent-runner lockfile (no PR content involved) on 10.8.2, 10.9.4 and
      # 10.9.7; 11.x is unaffected. npm 11 supports node 20 (engines:
      # ^20.17.0 || >=22.9.0), so this pins the fix without moving node.
      # Pinned exactly, not `npm@11`: the npm 10 bug survived three patch
      # releases before anyone caught it, so bump this deliberately. See #1228.
      - name: Pin npm 11.6.2 (node 20's bundled npm 10.x crashes on --no-save)
        if: steps.filter.outputs.agent-runner == 'true'
        run: npm i -g npm@11.6.2

      # The next three steps were previously one step holding all three
      # commands. The log's group header is derived from the run script's first
      # line (the real job logged `##[group]Run npm ci`), so the crash below
      # appeared under a group reading "npm ci" and was misread as a corrupt
      # lockfile for two weeks. Split so each command logs under its own name.
      - name: Install agent-runner dependencies
        if: steps.filter.outputs.agent-runner == 'true'
        working-directory: container/agent-runner
        run: npm ci

      # vitest isn't a declared dep (the container Dockerfile installs devDeps
      # into the runtime image), so declaring it would bloat the agent image.
      # Install ephemerally, pinned to the root's version (see root package-lock).
      - name: Install vitest (ephemeral, not saved)
        if: steps.filter.outputs.agent-runner == 'true'
        working-directory: container/agent-runner
        run: npm install --no-save vitest@4.1.8

      - name: Run agent-runner tests
        if: steps.filter.outputs.agent-runner == 'true'
        working-directory: container/agent-runner
        run: npx vitest run
